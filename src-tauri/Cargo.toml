[package]
name = "dns-manager"
version = "0.1.0"
description = "DNS Manager - API aggregation for DNSPod, Cloudflare, and Alibaba Cloud"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
tauri = { version = "2.11.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
log = "0.4"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "native-tls"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async trait support
async-trait = "0.1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Crypto for API signatures
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
base64 = "0.22"

# UUID for credential IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Secure credential storage
keyring = { version = "3", features = ["windows-native", "sync-secret-service"] }

# URL encoding
urlencoding = "2"

# Random number generation (for jitter in retry)
rand = "0.8"
